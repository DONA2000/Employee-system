<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
        </tr>
        {% for i in employees %}
        <tr>
            <td>{{i.name}}</td>
            <td>{{i.email}}</td>
            <td>{{i.department}}</td>
            <td><a href="{% url 'employee_update' i.id %}"><button>update</button></a></td>
            <td><a href="{% url 'employee_delete' i.id %}"><button>delete</button></a></td>
            <td><a href="{% url 'employee_detail' i.id %}">View Details</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
